<!DOCTYPE html>
<html>

<head>
<title>My Predictions</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>
body{
background:#f4f6f9;
padding:40px;
}

table{
width:100%;
background:white;
border-radius:10px;
overflow:hidden;
}

th{
background:#343a40;
color:white;
}

td,th{
padding:12px;
text-align:center;
}
</style>

</head>

<body>

<div class="container">

<h2 class="mb-4">📊 My Predictions</h2>

<table class="table table-bordered">
<thead>
<tr>
<th>Rent</th>
<th>Price</th>
<th>Date</th>
<th>Action</th>
</tr>
</thead>

<tbody id="predictionTable"></tbody>

</table>

<a href="/home" class="btn btn-dark mt-3">← Back</a>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
getFirestore,
collection,
query,
where,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyB1Apdn-DlO-sIRtM9GxZWcScvF73MvOLc",
authDomain: "house-rent-predictor-67b30.firebaseapp.com",
projectId: "house-rent-predictor-67b30",
storageBucket: "house-rent-predictor-67b30.firebasestorage.app",
messagingSenderId: "821441464234",
appId: "1:821441464234:web:5cf8da0f44aa622cda0dd3"
  // SAME CONFIG
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const parseTimestamp = (timestamp) => {
  if (!timestamp) return 'Unknown';
  try {
    if (typeof timestamp === 'string') return new Date(timestamp).toLocaleString();
    if (timestamp.seconds) return new Date(timestamp.seconds * 1000).toLocaleString();
    if (timestamp.toDate) return timestamp.toDate().toLocaleString();
  } catch (e) {}
  return 'Unknown';
};

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = '/';
    return;
  }

  const table = document.getElementById('predictionTable');
  table.innerHTML = '';
  const seen = new Set();

  try {
    const q = query(collection(db, 'predictions'), where('email', '==', user.email));
    const querySnapshot = await getDocs(q);
    querySnapshot.forEach((doc) => {
      const data = doc.data();
      const ts = parseTimestamp(data.timestamp);
      const key = `${data.rent}|${data.price}|${ts}`;
      seen.add(key);
      const url = `/prediction_view?rent=${encodeURIComponent(data.rent)}&price=${encodeURIComponent(data.price)}&pred_area=${encodeURIComponent(data.pred_area || 0)}&years=${encodeURIComponent(data.years || 15)}`;
      table.innerHTML += `
        <tr>
          <td>₹${data.rent}</td>
          <td>₹${data.price}</td>
          <td>${ts}</td>
          <td><a class="btn btn-sm btn-primary" href="${url}">View Dashboard</a></td>
        </tr>`;
    });
  } catch (e) {
    console.warn('Firestore read failed', e);
  }

  try {
    const resp = await fetch('/predictions_backup');
    if (resp.ok) {
      const backups = await resp.json();
      backups.forEach((b) => {
        if (b.email !== user.email) return;
        const ts = parseTimestamp(b.timestamp);
        const key = `${b.rent}|${b.price}|${ts}`;
        if (seen.has(key)) return;
        seen.add(key);
        const url = `/prediction_view?rent=${encodeURIComponent(b.rent)}&price=${encodeURIComponent(b.price)}&pred_area=${encodeURIComponent(b.pred_area || 0)}&years=${encodeURIComponent(b.years || 15)}`;
        table.innerHTML += `
          <tr>
            <td>₹${b.rent}</td>
            <td>₹${b.price}</td>
            <td>${ts}</td>
            <td><a class="btn btn-sm btn-primary" href="${url}">View Dashboard</a></td>
          </tr>`;
      });
    }
  } catch (e) {
    console.warn('Backup fetch failed', e);
  }

  if (table.innerHTML.trim() === '') {
    table.innerHTML = "<tr><td colspan='4'>No predictions found</td></tr>";
  }
});

</script>

</body>
</html>
