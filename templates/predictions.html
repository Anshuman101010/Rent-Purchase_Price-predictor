<!DOCTYPE html>
<html>

<head>
<title>My Predictions</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>
body{
background:#f4f6f9;
padding:40px;
}

table{
width:100%;
background:white;
border-radius:10px;
overflow:hidden;
}

th{
background:#343a40;
color:white;
}

td,th{
padding:12px;
text-align:center;
}
</style>

</head>

<body>

<div class="container">

<h2 class="mb-4">📊 My Predictions</h2>

<table class="table table-bordered">
<thead>
<tr>
<th>Rent</th>
<th>Price</th>
<th>Date</th>
</tr>
</thead>

<tbody id="predictionTable"></tbody>

</table>

<a href="/home" class="btn btn-dark mt-3">← Back</a>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
getFirestore,
collection,
query,
where,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyB1Apdn-DlO-sIRtM9GxZWcScvF73MvOLc",
authDomain: "house-rent-predictor-67b30.firebaseapp.com",
projectId: "house-rent-predictor-67b30",
storageBucket: "house-rent-predictor-67b30.firebasestorage.app",
messagingSenderId: "821441464234",
appId: "1:821441464234:web:5cf8da0f44aa622cda0dd3"
  // SAME CONFIG
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// ✅ WAIT FOR AUTH (THIS IS THE KEY FIX)
onAuthStateChanged(auth, async (user) => {

if(user){

console.log("User:", user.email);

// ✅ QUERY ONLY USER DATA
const q = query(
collection(db,"predictions"),
where("email","==",user.email)
);

const querySnapshot = await getDocs(q);

let table = document.getElementById("predictionTable");
table.innerHTML = "";

// ✅ ADD ROWS
querySnapshot.forEach((doc)=>{

let data = doc.data();

let row = `
<tr>
<td>₹${data.rent}</td>
<td>₹${data.price}</td>
<td>${new Date(data.timestamp.seconds * 1000).toLocaleString()}</td>
</tr>
`;

table.innerHTML += row;

});

// ✅ IF EMPTY
if(table.innerHTML === ""){
table.innerHTML = "<tr><td colspan='3'>No predictions found</td></tr>";
}

}else{

console.log("No user → redirecting");
window.location.href = "/";

}

});

</script>

</body>
</html>
