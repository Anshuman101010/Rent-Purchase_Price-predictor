<!DOCTYPE html>
<html>

<head>

<title>Login</title>

<link rel="stylesheet" href="{{ url_for('static', filename='login_signup_style.css') }}">

</head>

<body>

<!-- Animated Background -->
<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="auth-container">

<div class="auth-card">

<h2>🏠 Rent Predictor</h2>
<p>Login to continue</p>

<div class="input-group">
<input type="email" id="email" placeholder="Enter Email">
</div>

<div class="input-group">
<input type="password" id="password" placeholder="Enter Password">
</div>

<button class="auth-btn" onclick="login()">Login</button>

<div class="switch-link">
New user? <a href="/signup">Create Account</a>
</div>

</div>

</div>

<!-- Firebase Script -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getAuth, signInWithEmailAndPassword }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


const firebaseConfig = {

apiKey: "AIzaSyB1Apdn-DlO-sIRtM9GxZWcScvF73MvOLc",
authDomain: "house-rent-predictor-67b30.firebaseapp.com",
projectId: "house-rent-predictor-67b30",
storageBucket: "house-rent-predictor-67b30.firebasestorage.app",
messagingSenderId: "821441464234",
appId: "1:821441464234:web:5cf8da0f44aa622cda0dd3"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

window.login=function(){

const email=document.getElementById("email").value;

const password=document.getElementById("password").value;

signInWithEmailAndPassword(auth,email,password)

.then(()=>{

window.location.href="/home";

})

.catch((error)=>{

alert(error.message);

});

}

</script>

</body>
</html>
