<!DOCTYPE html>
<html>

<head>

<title>House Rent + Price Predictor</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="{{ url_for('static', filename='style2.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<div class="container">

<div class="header text-center mb-5">
<h1>🏠 Smart House Rent Predictor</h1>
<p>Estimate rent and property value instantly</p>
</div>

<div class="card form-card">

<form action="/predict" method="post">

<div class="row">

<div class="col-md-6 mb-3">
<label><i class="fa-solid fa-house"></i> BHK</label>
<input type="number" name="bhk" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label><i class="fa-solid fa-ruler-combined"></i> Size (sqft)</label>
<input type="number" name="size" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label><i class="fa-solid fa-bath"></i> Bathrooms</label>
<input type="number" name="bathroom" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label><i class="fa-solid fa-city"></i> City</label>
<select name="city" class="form-control">
<option value="0">Mumbai</option>
<option value="1">Delhi</option>
<option value="2">Bangalore</option>
<option value="3">Hyderabad</option>
<option value="4">Chennai</option>
<option value="5">Kolkata</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label><i class="fa-solid fa-building"></i> Area Type</label>
<select name="area" class="form-control">
<option value="0">Super Area</option>
<option value="1">Carpet Area</option>
<option value="2">Built Area</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label><i class="fa-solid fa-couch"></i> Furnishing</label>
<select name="furnish" class="form-control">
<option value="0">Unfurnished</option>
<option value="1">Semi Furnished</option>
<option value="2">Fully Furnished</option>
</select>
</div>

</div>

<button class="btn btn-predict mt-4 w-100">
<i class="fa-solid fa-chart-line"></i> Predict Rent
</button>

</form>

</div>

</div>

</body>
</html>
