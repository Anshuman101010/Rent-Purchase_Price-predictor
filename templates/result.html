<!DOCTYPE html>
<html>

<head>

<title>Prediction Result</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="bg-light">

<div class="container mt-5 text-center">

<div class="result-box">

<h2>Prediction Results</h2>

<p class="rent-text">
Estimated Monthly Rent: ₹ {{rent}}
</p>

<p class="price-text">
Estimated House Price: ₹ {{price}}
</p>

<a href="/home" class="btn btn-dark mt-3">
Predict Again
</a>
<a href="/my_predictions" class="btn btn-success mt-3">
View My Predictions
</a>

</div>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
getFirestore,
collection,
addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyB1Apdn-DlO-sIRtM9GxZWcScvF73MvOLc",
authDomain: "house-rent-predictor-67b30.firebaseapp.com",
projectId: "house-rent-predictor-67b30",
storageBucket: "house-rent-predictor-67b30.firebasestorage.app",
messagingSenderId: "821441464234",
appId: "1:821441464234:web:5cf8da0f44aa622cda0dd3"
  // your config
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

onAuthStateChanged(auth, async (user) => {

if(user){

try{

await addDoc(collection(db,"predictions"),{

email: user.email,
rent: Number("{{rent}}"),
price: Number("{{price}}"),
timestamp: new Date()

});

console.log("✅ SAVED SUCCESSFULLY");

}catch(error){

console.log("❌ ERROR:", error);

}

}else{

console.log("❌ USER NOT FOUND");

}

});

</script>
</body>
</html>
